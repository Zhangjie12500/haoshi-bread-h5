name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest Haoshi HTML file
        run: |
          # Find the highest version number HTML file (e.g. Haoshi_V0.22.html)
          FILE=$(ls Haoshi_V0*.html 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$FILE" ]; then
            echo "No Haoshi_V0*.html found!"
            exit 1
          fi
          echo "Deploying: $FILE"
          echo "DEPLOY_FILE=$FILE" >> $GITHUB_ENV
          cp "$FILE" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
